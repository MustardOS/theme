name: muOS Complete Archive Manager Theme Releases

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    
concurrency: 
  group: release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
# Create theme archives here! Zipping everything together and creating a complete theme archive.
      - name: Zip Legacy directories
        run: |
          mkdir -p /tmp/release
          for dir in current/*/; do
            [ -d "$dir" ] || continue
            zip_name=$(basename "$dir")
            zip_path="/tmp/release/${zip_name}.muxthm"
            echo "Zipping contents of $dir into $zip_path"
            
            (cd "$dir" && zip -qq -r "$zip_path" ./*)
          done
          
# Create the archive!          
      - name: List archives
        run: |
          ls -1 /tmp/release
          
      - name: Update Current Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATIC_TAG="2601.0_Jacaranda_Latest"

          # 1. If the static release exists, delete it to clear out the old commit reference
          if gh release view "$STATIC_TAG" >/dev/null 2>&1; then
            echo "Deleting old static release to update commit target..."
            gh release delete "$STATIC_TAG" --cleanup-tag --yes
          fi

          # 2. Create a brand new static release directly on the newest commit hash
          echo "Recreating static release on commit $GITHUB_SHA..."
          gh release create "$STATIC_TAG" \
            --target "$GITHUB_SHA" \
            --title "2601.0 Jacaranda Themes Latest" \
            /tmp/release/*.muxthm docs/theme_data.json docs/theme_catalogue.muxzip

      - name: Release Info
        id: info
        run: |
          echo "Published themes: ${{steps.date.outputs.date}} to: https://github.com/${{ steps.env.outputs.RELEASE_ORG}}/${{ steps.env.outputs.RELEASE_REPO}}"
          
