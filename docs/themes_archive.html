<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>MustardOS Themes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="title-block">
        <a href="https://theme.muos.dev/">
            <h1>MustardOS Themes</h1>
        </a>
    </header>
    
    <div class="container previous-themes-page">
        <h1>Previous Theme Versions</h1>

        <p class="page-description">
          Looking for older MustardOS theme packs? You can download previous
          releases below.
        </p>

        <div class="version-grid">
          <div class="version-card">
            <h2>2601 Jacaranda</h2>
            <span>Released January 2026</span>
            <a class="download-btn" href="https://github.com/MustardOS/theme/releases/tag/2601.0_Jacaranda_2026-08-08_0440">
              View Release
            </a>
          </div>

          <div class="version-card">
            <h2>2508 Goose</h2>
            <span>Released August 2025</span>
            <a class="download-btn" href="https://github.com/MustardOS/theme/releases/tag/2508.0_Goose_2026-02-18_2335">
              View Release
            </a>
          </div>

          <div class="version-card">
            <h2>2502 Pixie</h2>
            <span>Released February 2025</span>
            <a class="download-btn" href="https://github.com/MustardOS/theme/releases/tag/2025-08-23_1523">
              View Release
            </a>
          </div>
        </div>
    </div>

</body>
</html>
